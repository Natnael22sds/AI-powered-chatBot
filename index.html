<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #chat-box {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white rounded-xl shadow-xl p-6">
    <h2 class="text-xl font-bold mb-4">Customer Support Chatbot</h2>

    <div id="chat-box" class="mb-4 space-y-2">
      <!-- Messages will appear here -->
    </div>

    <div class="flex">
      <input type="text" id="user-input" class="flex-1 border px-3 py-2 rounded-l-lg" placeholder="Type your message...">
      <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-r-lg">Send</button>
    </div>
  </div>

  <script>
    function appendMessage(message, sender) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = sender === 'user' ? 'text-right' : 'text-left';
      div.innerHTML = `<span class="inline-block p-2 rounded-lg ${sender === 'user' ? 'bg-blue-100' : 'bg-gray-200'}">${message}</span>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      input.value = '';

      fetch('chatbot.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `message=${encodeURIComponent(message)}`
      })
      .then(res => res.json())
      .then(data => {
        appendMessage(data.reply, 'bot');
      });
    }
  </script>

</body>
</html>
